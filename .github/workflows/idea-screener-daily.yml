# 08:00 Asia/Dubai = 04:00 UTC (UAE has no daylight saving).
name: Daily idea screen

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: idea-screener-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-daily-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: idea-screener/package-lock.json

      - name: Set up Python
        if: hashFiles('idea-screener/requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install npm packages
        working-directory: idea-screener
        run: npm install

      - name: Install Python packages
        if: hashFiles('idea-screener/requirements.txt') != ''
        run: python -m pip install -r idea-screener/requirements.txt

      - name: Run daily screen
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          # Runtime aliases already accepted by idea-screener (Cursor secret names).
          Google_Account_Json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          Google_Sheet_Id: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${FMP_API_KEY:-}" ] || missing+=(FMP_API_KEY)
          [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ] || missing+=(GOOGLE_SERVICE_ACCOUNT_JSON)
          [ -n "${GOOGLE_SHEET_ID:-}" ] || missing+=(GOOGLE_SHEET_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them at Settings → Secrets and variables → Actions (values are never printed)."
            exit 1
          fi
          # Server-side extractPitchesHeuristic — no CURSOR_API_KEY / model turn.
          # bdk call exits 1 unless the response has ok: true (tool throw → fail).
          npx --yes "@cursor/bdk@0.2.27" call runDailyScreen --dir idea-screener --input '{}' | tee "${RUNNER_TEMP}/runDailyScreen.json"
          node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync(process.env.RUNNER_TEMP + "/runDailyScreen.json", "utf8").trim();
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch {
              const start = raw.indexOf("{");
              const end = raw.lastIndexOf("}");
              if (start < 0 || end <= start) {
                console.error("runDailyScreen produced no JSON response");
                process.exit(1);
              }
              parsed = JSON.parse(raw.slice(start, end + 1));
            }
            if (parsed.ok !== true || parsed.isError === true) {
              console.error("runDailyScreen failed (ok/isError)");
              process.exit(1);
            }
          '
